[package]
name = "thunderprint"
version = "0.1.1"
edition = "2024"
description = "Locate where and when an audio recording was made from the thunder in it, using lightning detection data"
license = "MIT"
repository = "https://github.com/Hexay/thunderprint"
readme = "README.md"
keywords = ["geolocation", "thunder", "lightning", "acoustics", "osint"]
categories = ["command-line-utilities", "science", "multimedia::audio"]
include = ["src/**", "assets/viewer.html", "README.md", "LICENSE"]

[dependencies]
anyhow = "1.0"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
dotenvy = "0.15"
hound = "3.5"
rand = "0.8"
rand_distr = "0.6"
rayon = "1.10"
rusqlite = { version = "0.40", features = ["bundled"] }
rustfft = "6.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
ureq = "2.10"

[profile.release]
debug = 1
lto = "thin"
codegen-units = 1

[profile.dev]
opt-level = 2
